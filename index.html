<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Varenie">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Varenie</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--card:#1e1a17;--card2:#2b2621;--line:#36302a;--txt:#f4eee6;--mut:#ab9f92;--acc:#f0884a;--on:#2a1406;--p:#74b9f2;--ok:#9fd36a;--bad:#ff7461;--disp:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:active{opacity:.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,.btn,.big{font-family:var(--disp)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
header h1{margin:0;font-size:20px;font-weight:800;flex:1;text-align:center}
.ib{background:none;border:0;border-radius:12px;width:44px;height:44px;font-size:22px;color:var(--mut)}
main{padding:16px 16px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:13px}
h2{font-size:18px;margin:22px 0 10px;font-weight:800}
h3{margin:0;font-size:19px;font-weight:800;line-height:1.25}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=password],textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.btn{background:var(--acc);border:0;border-radius:12px;padding:14px;font-weight:600;color:var(--on);min-height:48px}
.btn.g{background:var(--card2);color:var(--txt)}.btn.w{width:100%}.btn:disabled{opacity:.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.target{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.target b{font-family:var(--disp);font-size:26px;font-weight:800}
.msg{padding:14px;border-radius:12px;background:var(--card2);margin-top:12px;font-size:14px}
.msg.err{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.opt .meta{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;font-size:14px;color:var(--mut)}
.opt .meta b{color:var(--txt)}
.opt .why{font-size:14px;color:var(--mut);margin:6px 0 0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .pr{white-space:nowrap;text-align:right;font-weight:600}
.row s{color:var(--mut);font-weight:400;font-size:13px;margin-right:4px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--card2);color:var(--mut);margin-left:6px}
.tag.deal{background:rgba(240,136,74,.18);color:var(--acc)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;flex:none;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .grow{color:var(--mut);text-decoration:line-through}
ol{padding-left:20px;margin:8px 0 0}ol li{margin:6px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}
details summary{cursor:pointer;color:var(--acc);font-weight:600;padding:8px 0}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .25s;padding-bottom:40px}
.sheet.open{transform:none}
.sh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.sh h3{flex:1;text-align:center;margin-right:44px}
.in{padding:4px 16px;max-width:640px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><span style="width:44px"></span><h1>Varenie</h1><button class="ib" id="setBtn" aria-label="Nastavenia">⚙</button></header>
<main id="main"></main>
<div class="sheet" id="sheet"></div>
<script>
"use strict";
const DEALS_URL="/akcie/deals.json";
const SUPA="https://dlbgfzjgkuwubomihkux.supabase.co",SUPA_KEY="sb_publishable_mp28D-V0T8ZAHW410MStGw_KWIFq5Dw";
const FOOD=["Mäso a ryby","Mliečne a vajcia","Ovocie a zelenina","Pečivo","Trvanlivé potraviny","Mrazené","Ostatné"];
const STORES=["Tesco","Lidl","Kaufland","Billa","Biedronka"];
const MEALS=[["r","Raňajky"],["o","Obed"],["v","Večera"]];
const SHARE={r:.25,o:.4,v:.35};
const ls={get(k,d){try{const v=localStorage.getItem("varenie_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("varenie_"+k,JSON.stringify(v))}catch(e){}}};
let cfg={key:"",model:"gemini-3.5-flash-lite",makraKey:"",stores:["Tesco"],club:true,pantry:"soľ, korenie, olej, múka, cukor, cesnak, ryža, cestoviny",avoid:"cibuľa",...ls.get("cfg",{})};
if(cfg.avoid===undefined)cfg.avoid="cibuľa";
let st={meal:null,portions:1,note:"",kcal:"",p:"",prep:false,days:5,people:1,...ls.get("form",{})};
if(st.meal==="t"){st.meal="v";st.prep=true}
let result=ls.get("result",null), checked=ls.get("checked",{}), saved=ls.get("saved",[]);
let deals=null, dealsWeek="", makra=null, view="plan";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const eur=n=>(Math.round(n*100)/100).toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)&&n>=0?n:null};
const defMeal=()=>{const h=new Date().getHours();return h<10?"r":h<14?"o":"v"};
if(!st.meal)st.meal=defMeal();

// ---------- deals
const effPrice=d=>{let p=d.club_price&&d.club_price<d.price?d.club_price:d.price;if(d.store==="Tesco"&&cfg.club)p*=0.85;return p};
async function loadDeals(){
  try{
    const r=await fetch(DEALS_URL+"?t="+Date.now());if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json(), today=iso(new Date());dealsWeek=j.week||"";
    deals=(j.deals||[]).filter(d=>!d.upcoming&&FOOD.includes(d.category)&&(!d.valid_to||d.valid_to>=today)&&(!d.valid_from||d.valid_from<=today)&&d.price>0);
    ls.set("dealsCache",{deals,week:dealsWeek});
  }catch(e){const c=ls.get("dealsCache",null);if(c){deals=c.deals;dealsWeek=c.week}else deals=[]}
}

// ---------- Makrá: what's left today
const STEP_BASE=3000,STEP_KCAL=0.0004,BIKE_KCAL_PER_KM=0.225,PEPTIDE_PKG=2.2;
function computeGoals(pr,stp,bk){
  if(!pr||!pr.kcal||!pr.w)return null;
  const bonus=(pr.useSteps&&stp!=null?Math.round(Math.max(0,stp-STEP_BASE)*STEP_KCAL*pr.w):0)+(pr.useBike&&bk?Math.round(bk*BIKE_KCAL_PER_KM*pr.w):0);
  const kcal=pr.kcal+bonus,pkg=pr.usePeptides?Math.max(pr.pkg||1.8,PEPTIDE_PKG):(pr.pkg||1.8),p=Math.round(pr.w*pkg),f=Math.round(kcal*(pr.fatPct||25)/100/9);
  return {kcal,p,f,c:Math.max(0,Math.round((kcal-p*4-f*9)/4))};
}
async function loadMakra(){
  if(!cfg.makraKey){makra=null;return}
  try{
    const r=await fetch(`${SUPA}/rest/v1/rpc/makra_backup_load`,{method:"POST",headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({secret:cfg.makraKey})});
    const j=await r.json();if(!r.ok||!j||!j.data)throw new Error("nenašiel som zálohu");
    const d=j.data,day=iso(new Date()),items=(d.log||{})[day]||[];
    const eaten=items.reduce((t,e)=>({kcal:t.kcal+(e.kcal||0),p:t.p+(e.p||0),c:t.c+(e.c||0),f:t.f+(e.f||0)}),{kcal:0,p:0,c:0,f:0});
    const g=computeGoals(d.profile,(d.steps||{})[day],(d.bike||{})[day])||d.goals||{kcal:1800,p:130};
    makra={goal:g,eaten,left:{kcal:Math.round(g.kcal-eaten.kcal),p:Math.round(g.p-eaten.p),c:Math.round((g.c||0)-eaten.c),f:Math.round((g.f||0)-eaten.f)}};
  }catch(e){makra={err:e.message}}
}

// ---------- AI
async function ai(prompt){
  if(!cfg.key)throw new Error("najprv vlož Gemini API kľúč v nastaveniach (⚙)");
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`,{method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{response_mime_type:"application/json",temperature:0.7}})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||"HTTP "+r.status);
  return JSON.parse(j.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("")||"{}");
}
function target(){
  const k=num(st.kcal),p=num(st.p);
  if(k||p)return {kcal:k,p,c:null,f:null,src:"ručne"};
  if(makra&&makra.goal&&st.prep){const s=SHARE[st.meal];return {kcal:Math.round(makra.goal.kcal*s),p:Math.round(makra.goal.p*s),c:makra.goal.c?Math.round(makra.goal.c*s):null,f:makra.goal.f?Math.round(makra.goal.f*s):null,src:"Makrá"}}
  if(makra&&makra.left){
    const share={r:.3,o:.45,v:1}[st.meal]||1;
    return {kcal:Math.max(250,Math.round(makra.left.kcal*share)),p:Math.max(15,Math.round(makra.left.p*share)),c:Math.max(10,Math.round(makra.left.c*share)),f:Math.max(5,Math.round(makra.left.f*share)),src:"Makrá"};
  }
  return {kcal:null,p:null,src:null};
}
async function suggest(){
  const box=$("#amsg");
  const pool=deals.filter(d=>cfg.stores.includes(d.store));
  if(!pool.length){box.innerHTML=`<div class="msg err">Pre vybrané obchody teraz nemám žiadne akcie na potraviny.</div>`;return}
  box.innerHTML=`<div class="msg"><span class="spin"></span>Skladám jedlá z akcií…</div>`;$("#go").disabled=true;
  const t=target(),meal=MEALS.find(m=>m[0]===st.meal)[1],port=st.prep?st.days*st.people:st.portions;
  const list=pool.map((d,i)=>`${i}|${d.store}|${d.name}${d.brand?" ("+d.brand+")":""}|${d.unit||""}|${effPrice(d).toFixed(2)}`).join("\n");
  const prompt=`Si praktický kuchár a výživový poradca na Slovensku. ${st.prep?`Navrhni 3 rôzne jedlá na MEAL PREP: ${meal.toLowerCase()} na ${st.days} dní${st.people>1?` pre ${st.people} osoby`:""}, spolu ${port} porcií. Nakupuje sa dnes, varí sa raz v nedeľu a jedlo sa rozdelí do krabičiek na pondelok až ${["","","utorok","stredu","štvrtok","piatok","sobotu","nedeľu"][st.days]||"piatok"}. Jedlo musí vydržať v chladničke 4–5 dní (alebo sa dať zamraziť), dobre sa ohrievať v mikrovlnke a nesmie sa rozmočiť. Množstvá a počet balení počítaj na všetkých ${port} porcií.`:`Navrhni 3 rôzne jedlá typu "${meal}" pre ${port} ${port===1?"porciu":"porcie"}.`}
${t.kcal?`Cieľ na 1 porciu: približne ${t.kcal} kcal${t.p?`, bielkoviny aspoň ${t.p} g`:""}${t.c!=null?`, sacharidy okolo ${t.c} g`:""}${t.f!=null?`, tuky okolo ${t.f} g`:""}. Drž sa čo najbližšie všetkých makier, nielen kalórií.`:"Cieľ: vyvážené, sýte jedlo s dostatkom bielkovín."}
Hlavné suroviny ber čo najviac z týchto aktuálnych akcií (formát: id|obchod|produkt|balenie|cena za balenie v €):
${list}
Doma už má: ${cfg.pantry||"základné korenie a olej"}. Tieto suroviny nekupuj.
${cfg.avoid?`NIKDY nepoužívaj (ani ako prísadu, ani v omáčke): ${cfg.avoid}.`:""}
Poznámka používateľa: ${st.note||"žiadna"}.
Pravidlá: jednoduché jedlá, max. ${st.prep?"90":"45"} min. Uprednostni lacné a sýte. Kalórie a makrá počítaj reálne podľa množstiev. Ak surovinu nie je v akcii, aj tak ju môžeš použiť, ale označ deal:null a odhadni cenu v bežnom slovenskom obchode.
Vráť iba JSON: {"options":[{"name":string,"time_min":number,"portions":number,"per_portion":{"kcal":number,"p":number,"c":number,"f":number},"ingredients":[{"name":string,"amount":string (napr. "500 g"),"deal":number|null (id z akcií),"packs":number (koľko balení kúpiť, len pri deal),"est_price":number|null (len keď deal je null),"pantry":boolean}],"steps":[string]}]}`;
  try{
    const d=await ai(prompt);
    const opts=(d.options||[]).filter(o=>o&&o.name&&Array.isArray(o.ingredients)).map(o=>({...o,ingredients:o.ingredients.map(x=>{
      const dl=Number.isInteger(x.deal)&&pool[x.deal]?pool[x.deal]:null;
      return {name:String(x.name||""),amount:String(x.amount||""),pantry:!!x.pantry&&!dl,deal:dl,packs:dl?Math.max(1,Math.round(num(x.packs)||1)):0,est:dl?null:num(x.est_price)};
    })}));
    if(!opts.length)throw new Error("AI nevrátila žiadne jedlo, skús znova");
    result={at:Date.now(),meal:st.meal,target:t,opts};checked={};ls.set("result",result);ls.set("checked",checked);
    box.innerHTML="";render();
  }catch(e){box.innerHTML=`<div class="msg err">Nepodarilo sa: ${esc(e.message)}</div>`}
  finally{const b=$("#go");if(b)b.disabled=false}
}
const saveAmt=o=>o.ingredients.reduce((a,x)=>x.deal&&!x.pantry?a+Math.max(0,(x.deal.old_price||x.deal.price)-effPrice(x.deal))*x.packs:a,0);
const cost=o=>o.ingredients.reduce((a,x)=>{if(x.pantry)return a;if(x.deal)a.deal+=effPrice(x.deal)*x.packs;else if(x.est)a.other+=x.est;return a},{deal:0,other:0});

// ---------- render
function optCard(o,oi,savedIdx){
  const c=cost(o),pp=o.per_portion||{},t=result?.target||{};
  const buy=o.ingredients.filter(x=>!x.pantry),home=o.ingredients.filter(x=>x.pantry);
  const key=savedIdx!=null?"s"+savedIdx:"r"+oi;
  return `<div class="card opt"><h3>${esc(o.name)}</h3>
   <div class="meta"><span><b>${Math.round(pp.kcal||0)}</b> kcal</span><span>B <b>${Math.round(pp.p||0)} g</b></span><span>S <b>${Math.round(pp.c||0)} g</b></span><span>T <b>${Math.round(pp.f||0)} g</b></span><span>${o.portions||1}× ${(o.portions||1)>4?"porcií":(o.portions||1)>1?"porcie":"porcia"}</span>${o.time_min?`<span>${o.time_min} min</span>`:""}</div>
   ${t.kcal&&savedIdx==null?`<div class="sm" style="color:${Math.abs((pp.kcal||0)-t.kcal)<=t.kcal*.15?"var(--ok)":"var(--mut)"}">cieľ ${t.kcal} kcal${t.p?` · B ${t.p}`:""}${t.c!=null?` · S ${t.c}`:""}${t.f!=null?` · T ${t.f} g`:""}</div>`:""}
   <h2 style="margin-top:16px">Nákup <span class="mut sm" style="font-weight:400">${eur(c.deal+c.other)}${c.other?" (odhad)":""}</span></h2>
   ${buy.map((x,i)=>{const id=key+"-"+i,on=!!checked[id];return `<div class="row ${on?"done":""}"><button class="chk ${on?"on":""}" data-chk="${id}" aria-label="Kúpené"></button>
     <div class="grow">${esc(x.name)} <span class="mut sm">${esc(x.amount)}</span><br>${x.deal?`<span class="sm mut">${esc(x.deal.store)}: ${esc(x.deal.name)} ${esc(x.deal.unit||"")}${x.packs>1?` × ${x.packs}`:""}</span><span class="tag deal">akcia</span>`:`<span class="tag">mimo akcie</span>`}</div>
     <div class="pr">${x.deal?`${x.deal.old_price?`<s>${eur(x.deal.old_price*x.packs)}</s>`:""}${eur(effPrice(x.deal)*x.packs)}`:x.est?`~${eur(x.est)}`:""}</div></div>`}).join("")}
   <div class="row" style="border-top:2px solid var(--line);font-weight:700"><div class="grow">Spolu${c.other?' <span class="mut sm" style="font-weight:400">(časť odhadom)</span>':''}<br><span class="mut sm" style="font-weight:400">${eur((c.deal+c.other)/(o.portions||1))} na porciu${saveAmt(o)>0.005?` · ušetríš ${eur(saveAmt(o))}`:""}</span></div><div class="pr" style="font-size:20px">${eur(c.deal+c.other)}</div></div>
   ${home.length?`<div class="sm mut" style="margin-top:8px">Z domu: ${home.map(x=>esc(x.name)).join(", ")}</div>`:""}
   <details><summary>Postup</summary><ol>${(o.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></details>
   ${savedIdx==null?`<button class="btn g w" data-save="${oi}">Uložiť recept</button>`:`<button class="btn g w" data-unsave="${savedIdx}">Odstrániť z uložených</button>`}</div>`;
}
function render(){
  const t=target(),stores=[...new Set((deals||[]).map(d=>d.store))];
  let h=`<div class="tabs"><button class="chip ${view==="plan"?"on":""}" data-view="plan">Navrhnúť</button><button class="chip ${view==="saved"?"on":""}" data-view="saved">Uložené (${saved.length})</button></div>`;
  if(view==="saved"){
    h+=saved.length?saved.map((o,i)=>optCard(o,null,i)).join(""):`<p class="mut">Zatiaľ nič. Pri návrhu daj „Uložiť recept“.</p>`;
    $("#main").innerHTML=h;return;
  }
  h+=`<div class="card">${makra&&makra.left?`<div class="sm mut">Makrá dnes</div><div class="target"><span><b>${Math.max(0,makra.left.kcal)}</b> <span class="mut sm">kcal zostáva</span></span><span><b>${Math.max(0,makra.left.p)} g</b> <span class="mut sm">bielkovín</span></span></div>`
     :makra&&makra.err?`<div class="sm" style="color:var(--bad)">Makrá: ${esc(makra.err)}</div>`:`<div class="sm mut">Prepoj Makrá v nastaveniach a cieľ sa vyplní sám podľa toho, čo ti dnes ostáva.</div>`}
    <label>Jedlo</label><div class="chips">${MEALS.map(([k,l])=>`<button class="chip ${k===st.meal?"on":""}" data-meal="${k}">${l}</button>`).join("")}</div>
    <label>Režim</label><div class="chips"><button class="chip ${!st.prep?"on":""}" data-prep="0">Jedno jedlo</button><button class="chip ${st.prep?"on":""}" data-prep="1">Meal prep</button></div>
    ${st.prep?`<label>Na koľko dní (od pondelka)</label><div class="chips">${[3,4,5,7].map(n=>`<button class="chip ${n===st.days?"on":""}" data-days="${n}">${n}</button>`).join("")}</div>
     <label>Pre koľko osôb</label><div class="chips">${[1,2].map(n=>`<button class="chip ${n===st.people?"on":""}" data-people="${n}">${n}</button>`).join("")}</div>`
    :`<label>Porcie</label><div class="chips">${[1,2,4,6].map(n=>`<button class="chip ${n===st.portions?"on":""}" data-port="${n}">${n}</button>`).join("")}</div>`}
    <label>Obchody</label><div class="chips">${STORES.filter(s=>stores.includes(s)).map(s=>`<button class="chip ${cfg.stores.includes(s)?"on":""}" data-store="${s}">${s}</button>`).join("")}</div>
    <div class="g2"><div><label>kcal na porciu</label><input type="text" inputmode="decimal" id="fk" value="${esc(st.kcal)}" placeholder="${t.src==="Makrá"?t.kcal:"auto"}"></div>
    <div><label>bielkoviny (g)</label><input type="text" inputmode="decimal" id="fp" value="${esc(st.p)}" placeholder="${t.src==="Makrá"?t.p:"auto"}"></div></div>
    <label>Poznámka</label><input type="text" id="fn" value="${esc(st.note)}" placeholder="napr. bez rýb, rýchlo, mám kuracie prsia">
    <button class="btn w" style="margin-top:16px" id="go" ${deals?"":"disabled"}>${deals?"Navrhnúť jedlá z akcií":"Načítavam akcie…"}</button>
    <div id="amsg"></div>
    <div class="sm mut" style="margin-top:10px">${deals?`${deals.filter(d=>cfg.stores.includes(d.store)).length} potravín v akcii${dealsWeek?` · leták ${esc(dealsWeek)}`:""}${cfg.club&&cfg.stores.includes("Tesco")?" · Tesco ceny s kartou −15 %":""}`:""}</div></div>`;
  if(result)h+=`<h2>Návrhy <span class="mut sm" style="font-weight:400">${new Date(result.at).toLocaleString("sk-SK",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}</span></h2>`+result.opts.map((o,i)=>optCard(o,i)).join("");
  $("#main").innerHTML=h;
  $("#fk").oninput=e=>{st.kcal=e.target.value;ls.set("form",st)};
  $("#fp").oninput=e=>{st.p=e.target.value;ls.set("form",st)};
  $("#fn").oninput=e=>{st.note=e.target.value;ls.set("form",st)};
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.view){view=d.view;render()}
  else if(d.meal){st.meal=d.meal;ls.set("form",st);render()}
  else if(d.port){st.portions=+d.port;ls.set("form",st);render()}
  else if(d.prep){st.prep=d.prep==="1";if(st.prep&&st.meal==="r")st.meal="v";ls.set("form",st);render()}
  else if(d.days){st.days=+d.days;ls.set("form",st);render()}
  else if(d.people){st.people=+d.people;ls.set("form",st);render()}
  else if(d.store){const s=cfg.stores;s.includes(d.store)?cfg.stores=s.filter(x=>x!==d.store):s.push(d.store);if(!cfg.stores.length)cfg.stores=[d.store];ls.set("cfg",cfg);render()}
  else if(b.id==="go")suggest();
  else if(d.chk){checked[d.chk]=!checked[d.chk];ls.set("checked",checked);render()}
  else if(d.save!=null){saved.unshift(result.opts[+d.save]);ls.set("saved",saved);b.textContent="Uložené";b.disabled=true}
  else if(d.unsave!=null){saved.splice(+d.unsave,1);ls.set("saved",saved);render()}
  else if(d.close!=null){$("#sheet").classList.remove("open");loadMakra().then(render)}
});

// ---------- settings
$("#setBtn").onclick=()=>{
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sh"><button class="ib" data-close aria-label="Zavrieť">×</button><h3>Nastavenia</h3></div><div class="in">
   <label>Gemini API kľúč (ten istý ako v Makrá)</label><input type="password" id="sk" value="${esc(cfg.key)}" autocomplete="off">
   <label>Model</label><input type="text" id="sm" value="${esc(cfg.model)}" autocapitalize="off">
   <label>Kľúč zálohy z Makrá (ten istý ako pri krokoch)</label><input type="password" id="smk" value="${esc(cfg.makraKey)}" autocomplete="off">
   <p class="sm mut">Varenie si z neho len prečíta, koľko ti dnes ostáva kalórií a bielkovín. Do Makrá nič nezapisuje.</p>
   <label>Doma vždy mám</label><textarea id="sp">${esc(cfg.pantry)}</textarea>
   <label>Nikdy nepoužívať</label><textarea id="sa" placeholder="napr. cibuľa, huby">${esc(cfg.avoid||"")}</textarea>
   <label>Tesco karta</label><div class="chips"><button class="chip ${cfg.club?"on":""}" id="sc">−15 % na akciové ceny v Tescu</button></div>
   <button class="btn w" style="margin-top:20px" data-close>Hotovo</button></div>`;
  sh.classList.add("open");
  const save=()=>{cfg.key=$("#sk").value.trim();cfg.model=$("#sm").value.trim()||"gemini-3.5-flash-lite";cfg.makraKey=$("#smk").value.trim();cfg.pantry=$("#sp").value.trim();cfg.avoid=$("#sa").value.trim();ls.set("cfg",cfg)};
  ["#sk","#sm","#smk","#sp","#sa"].forEach(q=>$(q).oninput=save);
  $("#sc").onclick=()=>{cfg.club=!cfg.club;ls.set("cfg",cfg);$("#sc").classList.toggle("on",cfg.club)};
};

render();
Promise.all([loadDeals(),loadMakra()]).then(render);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadMakra().then(()=>{if(view==="plan"&&!$("#sheet").classList.contains("open"))render()})});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
